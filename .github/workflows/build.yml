name: Build Cut Luk APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/cutlukpro
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' } android { namespace 'com.cutlukpro'; compileSdk 34; defaultConfig { applicationId 'com.cutlukpro'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }" > app/build.gradle
          echo "<manifest xmlns:android='http://schemas.android.com/apk/res/android'><application android:label='CutLuk Pro'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          echo "package com.cutlukpro; import android.os.Bundle; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); TextView tv = new TextView(this); tv.setText(\"CutLuk Pro Instalado\"); setContentView(tv); } }" > app/src/main/java/com/cutlukpro/MainActivity.java
          echo "<resources><string name='app_name'>CutLuk Pro</string></resources>" > app/src/main/res/values/strings.xml
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CutLuk-Installer
          path: app/build/outputs/apk/debug/*.apk
