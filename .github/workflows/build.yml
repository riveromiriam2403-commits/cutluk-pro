name: Build Cut Luk APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Crear proyecto Cut Luk
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }
          EOF
          mkdir -p app/src/main/java/com/cutlukpro
          mkdir -p app/src/main/res/values
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.cutlukpro'; compileSdk 34; defaultConfig { applicationId "com.cutlukpro"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="CutLuk Pro"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/cutlukpro/MainActivity.kt << 'EOF'
          package com.cutlukpro; import android.os.Bundle; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; class MainActivity: AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); val tv = TextView(this); tv.text = "CutLuk Pro Instalado!"; tv.textSize = 24f; setContentView(tv) } }
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">CutLuk Pro</string></resources>
          EOF
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CutLuk-Installer
          path: app/build/outputs/apk/debug/*.apk
