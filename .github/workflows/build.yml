name: APK de Build Cut Luk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Crear app
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/cutlukpro
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          echo "plugins { id 'com.android.application' } android { namespace 'com.cutlukpro'; compileSdk 34; defaultConfig { applicationId 'com.cutlukpro'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="CutLuk"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.cutlukpro; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText("CutLuk Pro Listo"); t.setTextSize(30); setContentView(t); } }' > app/src/main/java/com/cutlukpro/MainActivity.java
      - uses: gradle/actions/setup-gradle@v3
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CutLuk-Installer
          path: app/build/outputs/apk/debug/*.apk
